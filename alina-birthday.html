<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сейф для Алины</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one card on a notebook-grid page; each act replaces the previous one inside the card */
:root{
  --paper:#fff6f8;
  --grid:#f6d9e2;
  --pink:#ffd6e3;
  --butter:#fff1b8;
  --ink:#3a2433;
  --muted:#8a6a7c;
  --hot:#ff3d7f;
  --sun:#ffb800;
  --card:#ffffff;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pen:"Caveat","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.5;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 40px;
  overflow-x:hidden;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:800}
.dots{display:flex;gap:6px}
.restart{font:800 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;padding:4px 0;cursor:pointer}
.restart:hover{color:var(--hot)}
.restart:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--pink);border:2px solid var(--hot);opacity:.35}
.dots i.on{opacity:1;background:var(--hot)}
.card{
  background:var(--card);border:2px solid var(--ink);border-radius:22px;
  box-shadow:6px 6px 0 var(--ink);padding:28px 24px;position:relative;
  display:flex;flex-direction:column;gap:18px;
}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(28px,7vw,40px);font-weight:900}
h2{font-size:clamp(20px,5vw,26px);font-weight:700}
p{margin:0}
.lead{font-size:17px}
.muted{color:var(--muted);font-size:14px}
.btn{
  font:800 16px var(--body);color:var(--ink);background:var(--sun);
  border:2px solid var(--ink);border-radius:14px;padding:14px 22px;cursor:pointer;
  box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;align-self:flex-start;
  text-decoration:none;display:inline-block;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.btn.pink{background:var(--hot);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--butter);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;align-self:flex-start}
.pen{font-family:var(--pen);color:var(--hot);font-size:30px;line-height:1;transform:rotate(-4deg);display:inline-block}

/* safe */
.safe{width:min(220px,60vw);aspect-ratio:1;max-width:100%;margin:6px auto 0;background:var(--pink);border:3px solid var(--ink);border-radius:24px;position:relative;box-shadow:inset 0 0 0 10px #fff, 5px 5px 0 var(--ink)}
.safe .wheel{position:absolute;inset:28%;border-radius:50%;background:var(--butter);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:28px;animation:spin 6s linear infinite}
.safe .wheel::before,.safe .wheel::after{content:"";position:absolute;width:3px;height:100%;background:var(--ink)}
.safe .wheel::after{transform:rotate(90deg)}
.safe .wheel span{position:relative;z-index:1;background:var(--butter);border:3px solid var(--ink);border-radius:50%;width:52%;aspect-ratio:1;display:grid;place-items:center;font-size:18px}
@keyframes spin{to{transform:rotate(360deg)}}

/* quiz */
.opts{display:grid;gap:10px}
.opt{
  text-align:left;font:600 16px var(--body);color:var(--ink);background:var(--paper);
  border:2px solid var(--ink);border-radius:14px;padding:13px 16px;cursor:pointer;transition:background .15s,transform .12s;
}
.opt:hover{background:var(--butter);transform:translateX(3px)}
.result-num{font-family:var(--display);font-weight:900;font-size:clamp(64px,20vw,110px);line-height:1;color:var(--hot);text-shadow:4px 4px 0 var(--butter)}

/* code */
.code{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.code div{
  aspect-ratio:3/4;border:2px solid var(--ink);border-radius:14px;background:var(--paper);
  display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:clamp(28px,9vw,44px);color:var(--muted);
}
.code div.done{background:var(--butter);color:var(--ink);animation:pop .4s}
.code div.now{border-color:var(--hot);border-width:3px}
@keyframes pop{50%{transform:scale(1.15)}}
.task{background:var(--paper);border:2px dashed var(--muted);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.task .q{font-size:18px;font-weight:600}
.task .formula{font-family:var(--display);font-weight:700;font-size:clamp(26px,8vw,38px);text-align:center;padding:6px 0}
.answer{display:flex;gap:10px;flex-wrap:wrap}
.answer input{
  flex:1 1 120px;min-width:0;font:800 22px var(--display);color:var(--ink);text-align:center;
  border:2px solid var(--ink);border-radius:14px;padding:10px;background:#fff;
}
.feedback{min-height:24px;font-weight:600}
.feedback.bad{color:var(--hot)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* 6-7 meme */
.meme{position:fixed;inset:0;z-index:50;background:rgba(255,214,227,.94);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.meme-inner{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.hands{display:flex;gap:40px;font-size:clamp(70px,22vw,120px);line-height:1}
.hands span{display:inline-block}
.hands .l{animation:hl .5s ease-in-out infinite}
.hands .r{animation:hr .5s ease-in-out infinite}
@keyframes hl{0%,100%{transform:translateY(-28px)}50%{transform:translateY(28px)}}
@keyframes hr{0%,100%{transform:translateY(28px)}50%{transform:translateY(-28px)}}
.sixseven{font-family:var(--display);font-weight:900;font-size:clamp(34px,11vw,64px);color:var(--hot);text-shadow:4px 4px 0 var(--butter);animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.08) rotate(-3deg)}}

/* finale */
.plot{width:100%;max-width:100%;aspect-ratio:1;border:2px solid var(--ink);border-radius:16px;background:#fff;display:block}
.eq{font-family:var(--display);font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
.letter{font-size:17px;display:flex;flex-direction:column;gap:12px}
.sign{font-family:var(--pen);font-size:30px;color:var(--hot)}
.gift{background:var(--butter);border:2px solid var(--ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.gift .sum{font-family:var(--display);font-weight:900;font-size:clamp(36px,11vw,52px);line-height:1}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top"><button class="restart" id="restart" type="button">↺ Заново</button><span>29.10 · Алине 22</span><div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i></div></div>
  <main class="card" id="card"><noscript><h2>Это интерактивная открытка</h2><p class="lead">В режиме предпросмотра она не работает. Открой её в браузере (Safari или Chrome).</p></noscript></main>
</div>
<canvas class="confetti" id="confetti"></canvas>

<script>
/* ВСТАВЬТЕ СЮДА ССЫЛКУ НА СБОР */
const GIFT_URL = "https://t.tb.ru/pm_short/64Dyr0TbsWr";

const card = document.getElementById('card');
const dots = [...document.querySelectorAll('#dots i')];
function step(n){dots.forEach((d,i)=>d.classList.toggle('on',i<=n))}
function show(html){card.innerHTML=html;card.classList.remove('fade');void card.offsetWidth;card.classList.add('fade');window.scrollTo({top:0,behavior:'smooth'})}

/* ---------- Пролог ---------- */
function intro(){
  step(0);
  show(`
    <span class="tag">Совершенно секретно</span>
    <h1>Алина, с днём рождения!</h1>
    <div class="safe" aria-hidden="true"><div class="wheel"><span>?</span></div></div>
    <p class="lead">В этом сейфе лежит подарок. Открыть его может только именинница, поэтому сначала нужно пройти проверку личности, а потом подобрать код.</p>
    <button class="btn pink" id="go">Пройти проверку</button>
  `);
  document.getElementById('go').onclick=quiz;
}

/* ---------- Акт 1: Какое ты число ---------- */
const Q=[
  {q:"Идеальный выходной — это…",a:[["Поспать до обеда и никуда не спешить","e"],["Спонтанная поездка куда-нибудь","pi"],["Порядок дома и красивый план на неделю","phi"]]},
  {q:"Что тебя заряжает сильнее всего?",a:[["Люди, с которыми можно болтать часами","e"],["Новые впечатления и места","pi"],["Когда всё получается красиво и вовремя","phi"]]},
  {q:"Ученик опять не сделал домашку. Твоя реакция?",a:[["Спокойно объясню ещё раз, он поймёт","e"],["Придумаю задачу, от которой он не отвертится","pi"],["Строгий взгляд. Он знает, что будет","phi"]]},
  {q:"Твой любимый ресторан?",a:[["Караоке-бар в Серпухове «7 нот»","e"],["«Моя пьяная бабушка летит в Сингапур»","pi"],["Бар «Моряк и чайка»","phi"]]},
  {q:"Что ты выберешь?",a:[["Поехать ради концерта в Нижний Новгород и забить на него","e"],["Пойти на концерт и упасть на нём в обморок","phi"],["Всё и сразу — как без приключений?","pi"]]},
  {q:"Что для тебя самое важное в жизни?",a:[["Близкие люди","e"],["Свобода и мечты","pi"],["Гармония во всём","phi"]]},
  {q:"У тебя случилось что угодно. К кому идёшь?",a:[["К Жене, лучшему брату","x"],["К Веронике, подруге и золовке","x"],["Сразу к обоим","x"]],
   reply:"Правильный ответ: к нам. С любым вопросом, в любое время."}
];
const R={
  pi:{n:"π",t:"Ты бесконечная и неповторимая. Сколько ни вычисляй, всё равно найдётся новая интересная цифра. Таких, как ты, нельзя записать конечной дробью."},
  e:{n:"e",t:"Ты основа всего естественного и тёплого. Рядом с тобой всё растёт: настроение, знания учеников и наша любовь к тебе."},
  phi:{n:"φ",t:"Ты золотое сечение: в тебе всё в идеальной пропорции. Красота, ум и характер, причём ровно столько, сколько нужно."}
};
let qi=0,score={pi:0,e:0,phi:0};
function quiz(){
  step(1);
  if(qi>=Q.length) return result();
  const item=Q[qi];
  show(`
    <span class="tag">Проверка личности · ${qi+1} из ${Q.length}</span>
    <h2>${item.q}</h2>
    <div class="opts">${item.a.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join('')}</div>
  `);
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=item.a[b.dataset.i][1]; if(score[k]!==undefined) score[k]++;
    if(item.reply){
      show(`<span class="tag">Проверка личности · ${qi+1} из ${Q.length}</span>
        <span class="pen">Верно!</span>
        <h2>${item.reply}</h2>
        <p class="lead">Женя и Вероника всегда рядом. Это аксиома, доказательств не требует.</p>
        <button class="btn" id="nx">Дальше</button>`);
      document.getElementById('nx').onclick=()=>{qi++;quiz()};
    } else {qi++;quiz()}
  });
}
function result(){
  const top=Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0];
  const r=R[top];
  show(`
    <span class="tag">Личность подтверждена</span>
    <p class="lead">Алина, ты — число</p>
    <div class="result-num">${r.n}</div>
    <p class="lead">${r.t}</p>
    <span class="pen">Доступ к сейфу разрешён</span>
    <button class="btn pink" id="go">Перейти к сейфу</button>
  `);
  document.getElementById('go').onclick=()=>{ti=0;safe()};
}

/* ---------- Акт 2: Сейф ---------- */
const T=[
  {q:"На торте 22 свечки. Женя задул 11, Вероника задула 9 (они очень старались). Сколько свечек осталось задуть имениннице?",f:"22 − 11 − 9 = ?",ans:"2",hint:"Посчитай, сколько свечек задули Женя и Вероника вместе."},
  {q:"Разминка для учителя математики. Устный счёт, без калькулятора!",f:"6 + 7 = ?",ans:"13",meme:true,hint:"Шесть плюс семь. Ты справишься."},
  {q:"А теперь из того, что получилось, вычти 4.",f:"13 − 4 = ?",ans:"9",hint:"Тринадцать минус четыре."},
  {q:"Задача на подумать. Разрешается звонок другу из Бауманки.",f:"i²⁰²⁶ + 2 = ?",ans:"1",hint:"i в степени 4 равно 1. Найди остаток от деления 2026 на 4."},
  {q:"Сколько существует вопросов, с которыми Женя и Вероника тебе не помогут?",f:"∅ → ?",ans:"0",hint:"Подумай, кому ты можешь обратиться с любым вопросом."}
];
const DIGIT_TASKS=[0,2,3,4]; // какие задачи дают цифры кода 2-9-1-0
let ti=0,digits=[];
function safe(){
  step(2);
  if(ti>=T.length) return unlocked();
  const t=T[ti];
  const filled=digits.length;
  show(`
    <span class="tag">Код от сейфа</span>
    <div class="code">${[0,1,2,3].map(i=>`<div class="${i<filled?'done':''} ${i===filled?'now':''}">${i<filled?digits[i]:'?'}</div>`).join('')}</div>
    <div class="task" id="task">
      <p class="q">${t.q}</p>
      <div class="formula">${t.f}</div>
      <form class="answer" id="form">
        <input id="inp" inputmode="numeric" autocomplete="off" placeholder="Ответ" aria-label="Ответ">
        <button class="btn pink" type="submit">Проверить</button>
      </form>
      <p class="feedback" id="fb"></p>
    </div>
  `);
  const inp=document.getElementById('inp');
  let tries=0;
  document.getElementById('form').onsubmit=e=>{
    e.preventDefault();
    const v=inp.value.trim().replace(',', '.');
    const fb=document.getElementById('fb');
    if(v===t.ans){
      if(DIGIT_TASKS.includes(ti)) digits.push(t.ans);
      fb.className='feedback';fb.innerHTML='<span class="pen">Отлично! 5</span>';
      const next=()=>{ti++;safe()};
      if(t.meme) setTimeout(()=>sixSeven(next),500); else setTimeout(next,900);
    } else {
      tries++;
      const box=document.getElementById('task');box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
      fb.className='feedback bad';
      fb.textContent= tries>=2 ? 'Подсказка: '+t.hint : 'Сейф недоволен. Попробуй ещё раз.';
    }
  };
}

/* ---------- 6–7 ---------- */
function sixSeven(done){
  const m=document.createElement('div');m.className='meme';
  m.innerHTML=`<div class="meme-inner">
    <div class="hands"><span class="l">🫴</span><span class="r">🫴</span></div>
    <div class="sixseven" id="ss">SIX SEVEN</div>
    <p class="lead">13, конечно. Но сначала — шесть, семь!</p>
    <button class="btn" id="mclose">Ладно-ладно, дальше</button>
  </div>`;
  document.body.appendChild(m);
  const stop=beat();
  document.getElementById('mclose').onclick=()=>{stop();m.remove();done()};
}
function beat(){
  let alive=true,ctx=null,timer=null;
  try{
    if('speechSynthesis' in window){
      const say=()=>{ if(!alive) return;
        const u=new SpeechSynthesisUtterance('six seven! six seven!');u.lang='en-US';u.rate=1.15;u.pitch=1.3;
        u.onend=()=>{ if(alive) timer=setTimeout(say,250)};
        speechSynthesis.speak(u)};
      say();
    }
  }catch(e){}
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    let n=0;
    const tick=()=>{ if(!alive) return;
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='square';o.frequency.value=n%2?660:520;
      g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);
      o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.2);n++;
    };
    tick();var iv=setInterval(tick,250);
  }catch(e){}
  return ()=>{alive=false;clearTimeout(timer);clearInterval(iv);try{speechSynthesis.cancel()}catch(e){}try{ctx&&ctx.close()}catch(e){}};
}

/* ---------- Сейф открыт ---------- */
function unlocked(){
  show(`
    <span class="tag">Код подобран</span>
    <div class="code">${digits.map(d=>`<div class="done">${d}</div>`).join('')}</div>
    <h2>2910… Погоди-ка. Это же 29.10!</h2>
    <p class="lead">Код от сейфа — твой день рождения. Сейф открывается, а внутри лежит координатная плоскость и одна-единственная функция.</p>
    <button class="btn pink" id="go">Построить график</button>
  `);
  document.getElementById('go').onclick=finale;
}

/* ---------- Финал ---------- */
function finale(){
  step(3);
  let actx=null;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  show(`
    <span class="tag">Внутри сейфа</span>
    <canvas class="plot" id="plot" width="600" height="600" aria-label="График в форме сердца с числом 22"></canvas>
    <p class="eq">x = 16·sin³t<br>y = 13·cos t − 5·cos 2t − 2·cos 3t − cos 4t</p>
    <div id="after" hidden></div>
  `);
  drawHeart(()=>{
    popper(actx);
    confetti();
    const a=document.getElementById('after');a.hidden=false;a.className='fade';
    a.innerHTML=`<div class="letter" style="margin-top:6px">
      <h2>Алина, с днём рождения!</h2>
      <p>Тебе 22, и это очень красивое число: чётное, симметричное и делится на 11. Пусть этот год будет таким же — ровным, гармоничным и с приятными сюрпризами.</p>
      <p>Пусть ученики делают домашку, коллеги ценят, а жизнь решается только с ответом «всё хорошо». И помни: с любым вопросом ты всегда можешь прийти к нам.</p>
      <p><b>Мы тебя очень любим, ты лучшая сестра и подруга!</b></p>
      <p class="sign">Твои Женя и Вероника</p>
      <div class="gift">
        <span class="tag">Ответ последней задачи</span>
        <div class="sum">7 000 ₽</div>
        <p>На твои мечты, приятные покупки или что-нибудь совершенно бесполезное и очень радостное.</p>
        <a class="btn pink" href="${GIFT_URL}" target="_blank" rel="noopener">Забрать подарок</a>
      </div>
      <button class="btn" id="again" type="button">Пройти ещё раз</button>
    </div>`;
    document.getElementById('again').onclick=restart;
  });
}
function drawHeart(done){
  const c=document.getElementById('plot'),g=c.getContext('2d'),W=600,S=15,cx=300,cy=290;
  function axes(){
    g.clearRect(0,0,W,W);g.fillStyle='#fff';g.fillRect(0,0,W,W);
    g.strokeStyle='#f6d9e2';g.lineWidth=1;
    for(let i=0;i<=W;i+=30){g.beginPath();g.moveTo(i,0);g.lineTo(i,W);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(W,i);g.stroke()}
    g.strokeStyle='#8a6a7c';g.lineWidth=2;
    g.beginPath();g.moveTo(0,cy);g.lineTo(W,cy);g.moveTo(cx,0);g.lineTo(cx,W);g.stroke();
    g.fillStyle='#8a6a7c';g.font='600 18px Manrope, sans-serif';g.fillText('x',W-22,cy-8);g.fillText('y',cx+8,20);
  }
  const P=t=>[cx+S*16*Math.pow(Math.sin(t),3), cy-S*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))];
  const steps=240;let k=0;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(){
    k=reduce?steps:Math.min(steps,k+0.6);
    axes();
    g.beginPath();
    for(let i=0;i<=Math.floor(k);i++){const [x,y]=P(i/steps*2*Math.PI);i?g.lineTo(x,y):g.moveTo(x,y)}
    if(k===steps){g.closePath();g.fillStyle='#ffd6e3';g.fill()}
    g.strokeStyle='#ff3d7f';g.lineWidth=6;g.lineJoin='round';g.stroke();
    if(k===steps){
      g.fillStyle='#ff3d7f';g.font='900 120px Unbounded, sans-serif';g.textAlign='center';g.textBaseline='middle';
      g.fillText('22',cx,cy-10);g.textAlign='start';g.textBaseline='alphabetic';
      return done();
    }
    requestAnimationFrame(frame);
  }
  frame();
}
function popper(ctx){
  if(!ctx) return;
  try{
    const burst=(when,len,vol,freq)=>{
      const n=Math.floor(ctx.sampleRate*len),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
      const src=ctx.createBufferSource();src.buffer=buf;
      const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=0.8;
      const g=ctx.createGain();g.gain.value=vol;
      src.connect(f).connect(g).connect(ctx.destination);src.start(ctx.currentTime+when);
    };
    burst(0,0.35,1.6,1200);
    burst(0,0.12,1.2,300);
    for(let i=0;i<10;i++) burst(0.12+Math.random()*0.6,0.03,0.35,2500+Math.random()*2500);
  }catch(e){}
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.getElementById('confetti'),g=c.getContext('2d');
  const fit=()=>{c.width=innerWidth;c.height=innerHeight};fit();addEventListener('resize',fit);
  const cols=['#ff3d7f','#ffb800','#ffd6e3','#fff1b8','#3a2433'];
  const sym=['π','e','φ','∞','22','+','√','∑'];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,v:2+Math.random()*3,r:Math.random()*6,s:Math.random()<.25?sym[Math.random()*sym.length|0]:null,c:cols[Math.random()*cols.length|0],w:6+Math.random()*6,a:Math.random()*6}));
  let t=0;
  (function f(){
    g.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.a+t/20);p.a+=.02;
      g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;
      if(p.s){g.font='800 20px Manrope, sans-serif';g.fillText(p.s,0,0)}else g.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);
      g.restore()});
    t++; if(t<420) requestAnimationFrame(f); else g.clearRect(0,0,c.width,c.height);
  })();
}

function restart(){
  document.querySelectorAll('.meme').forEach(m=>m.remove());
  try{speechSynthesis.cancel()}catch(e){}
  qi=0;score={pi:0,e:0,phi:0};ti=0;digits=[];
  intro();
}
document.getElementById('restart').onclick=restart;

intro();
</script>
